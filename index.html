<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newcastle Port Pulse — Lower Third Package</title>
  <style>
    :root {
      --gold: #e29625;
      --cream: #f3ead8;
      --muted: rgba(243, 234, 216, 0.68);
      --panel: rgba(5, 7, 13, 0.82);
      --panel-deep: rgba(0, 0, 0, 0.68);
      --line: rgba(243, 234, 216, 0.16);
      --red: #d84a2b;
      --blue: #8fb7ff;
      --green: #9fe0bd;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: var(--font);
      color: var(--cream);
    }

    body {
      position: relative;
    }

    .lower-third {
      position: absolute;
      left: clamp(24px, 4vw, 72px);
      right: clamp(24px, 4vw, 72px);
      bottom: clamp(28px, 5vh, 72px);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: stretch;
      min-height: 106px;
      border: 1px solid var(--line);
      border-radius: 26px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(226,150,37,0.14), transparent 34%),
        var(--panel);
      box-shadow:
        0 24px 80px rgba(0,0,0,0.48),
        0 0 32px rgba(226,150,37,0.12);
      backdrop-filter: blur(16px);
      transform: translateY(140%);
      opacity: 0;
      animation: lowerThirdIn 11s ease-in-out infinite;
    }

    @keyframes lowerThirdIn {
      0%, 6% {
        transform: translateY(140%);
        opacity: 0;
      }

      12%, 78% {
        transform: translateY(0);
        opacity: 1;
      }

      88%, 100% {
        transform: translateY(140%);
        opacity: 0;
      }
    }

    .lower-third::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.025),
          rgba(255,255,255,0.025) 1px,
          transparent 1px,
          transparent 6px
        );
      opacity: 0.38;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .status-block {
      position: relative;
      min-width: clamp(120px, 12vw, 180px);
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(226,150,37,0.12);
      border-right: 1px solid rgba(226,150,37,0.28);
    }

    .signal-mark {
      width: clamp(54px, 5vw, 72px);
      aspect-ratio: 1;
      border: 2px solid rgba(226,150,37,0.72);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-weight: 950;
      letter-spacing: -0.06em;
      box-shadow:
        0 0 22px rgba(226,150,37,0.22),
        inset 0 0 20px rgba(226,150,37,0.12);
      animation: signalPulse 2.2s ease-in-out infinite;
    }

    @keyframes signalPulse {
      0%, 100% {
        opacity: 0.72;
        transform: scale(0.96);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    .content {
      position: relative;
      min-width: 0;
      padding: clamp(18px, 2vw, 26px);
      display: grid;
      align-content: center;
      gap: 8px;
    }

    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 950;
      font-size: clamp(0.66rem, 0.75vw, 0.82rem);
    }

    .title {
      color: var(--cream);
      text-transform: uppercase;
      font-size: clamp(1.55rem, 3vw, 3.45rem);
      line-height: 0.9;
      letter-spacing: -0.055em;
      font-weight: 950;
      text-shadow: 0 0 20px rgba(226,150,37,0.16);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(0.86rem, 1vw, 1.1rem);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .right-block {
      position: relative;
      min-width: clamp(190px, 18vw, 300px);
      display: grid;
      align-content: center;
      gap: 8px;
      padding: 18px 22px;
      background: var(--panel-deep);
      border-left: 1px solid var(--line);
      text-align: right;
    }

    .live-pill {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-size: 0.72rem;
      font-weight: 950;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
      animation: dotPulse 1.6s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.82);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .meta {
      color: var(--muted);
      font-size: clamp(0.78rem, 0.9vw, 0.96rem);
      line-height: 1.35;
    }

    .ticker {
      position: absolute;
      left: clamp(24px, 4vw, 72px);
      right: clamp(24px, 4vw, 72px);
      bottom: clamp(10px, 2vh, 22px);
      height: 34px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(40px);
      animation: tickerIn 11s ease-in-out infinite;
    }

    @keyframes tickerIn {
      0%, 12% {
        opacity: 0;
        transform: translateY(40px);
      }

      20%, 78% {
        opacity: 1;
        transform: translateY(0);
      }

      88%, 100% {
        opacity: 0;
        transform: translateY(40px);
      }
    }

    .ticker-label {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0 14px;
      color: var(--gold);
      background: rgba(226,150,37,0.12);
      border-right: 1px solid rgba(226,150,37,0.24);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-weight: 950;
      font-size: 0.62rem;
      white-space: nowrap;
    }

    .ticker-window {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-track {
      display: inline-block;
      padding-left: 100%;
      color: var(--cream);
      font-size: 0.78rem;
      letter-spacing: 0.035em;
      animation: scroll 34s linear infinite;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    /* MODE: WEATHER */
    body.weather .lower-third {
      background:
        linear-gradient(90deg, rgba(143,183,255,0.16), transparent 34%),
        var(--panel);
      box-shadow:
        0 24px 80px rgba(0,0,0,0.48),
        0 0 32px rgba(143,183,255,0.12);
    }

    body.weather .status-block {
      background: rgba(143,183,255,0.12);
      border-right-color: rgba(143,183,255,0.28);
    }

    body.weather .signal-mark,
    body.weather .eyebrow,
    body.weather .live-pill,
    body.weather .ticker-label {
      color: var(--blue);
      border-color: rgba(143,183,255,0.72);
    }

    body.weather .dot {
      background: var(--blue);
      box-shadow: 0 0 14px var(--blue);
    }

    /* MODE: ALERT */
    body.alert .lower-third {
      background:
        linear-gradient(90deg, rgba(216,74,43,0.22), transparent 36%),
        var(--panel);
      box-shadow:
        0 24px 80px rgba(0,0,0,0.5),
        0 0 38px rgba(216,74,43,0.18);
      animation:
        lowerThirdIn 11s ease-in-out infinite,
        alertJitter 3.8s steps(1) infinite;
    }

    @keyframes alertJitter {
      0%, 94%, 100% { filter: none; }
      95% { filter: contrast(1.15); transform: translateY(0) translateX(1px); }
      96% { filter: none; transform: translateY(0) translateX(-1px); }
    }

    body.alert .status-block,
    body.alert .ticker-label {
      background: rgba(216,74,43,0.15);
      border-color: rgba(216,74,43,0.3);
    }

    body.alert .signal-mark,
    body.alert .eyebrow,
    body.alert .live-pill,
    body.alert .ticker-label {
      color: var(--red);
      border-color: rgba(216,74,43,0.72);
    }

    body.alert .dot {
      background: var(--red);
      box-shadow: 0 0 14px var(--red);
    }

    body.alert .ticker-track {
      text-transform: uppercase;
    }

    /* MODE: AI */
    body.ai .lower-third {
      background:
        linear-gradient(90deg, rgba(159,224,189,0.13), transparent 34%),
        var(--panel);
      box-shadow:
        0 24px 80px rgba(0,0,0,0.48),
        0 0 32px rgba(159,224,189,0.1);
    }

    body.ai .status-block {
      background: rgba(159,224,189,0.1);
      border-right-color: rgba(159,224,189,0.24);
    }

    body.ai .signal-mark,
    body.ai .eyebrow,
    body.ai .live-pill,
    body.ai .ticker-label {
      color: var(--green);
      border-color: rgba(159,224,189,0.62);
    }

    body.ai .dot {
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
    }

    @media (max-width: 860px) {
      .lower-third {
        grid-template-columns: auto minmax(0, 1fr);
        right: clamp(16px, 4vw, 34px);
        left: clamp(16px, 4vw, 34px);
        min-height: 96px;
      }

      .right-block {
        display: none;
      }

      .status-block {
        min-width: 96px;
      }

      .ticker {
        left: clamp(16px, 4vw, 34px);
        right: clamp(16px, 4vw, 34px);
      }
    }

    @media (max-width: 560px) {
      .lower-third {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .status-block {
        display: none;
      }

      .title,
      .subtitle {
        white-space: normal;
      }

      .ticker {
        display: none;
      }
    }
  </style>
</head>

<!--
  MODE OPTIONS:
  body class="standard"
  body class="weather"
  body class="alert"
  body class="ai"
-->
<body class="standard">

  <section class="lower-third">
    <div class="status-block">
      <div class="signal-mark">NPP</div>
    </div>

    <div class="content">
      <div id="eyebrow" class="eyebrow">Signals After Dark</div>
      <div id="title" class="title">Newcastle Port Pulse</div>
      <div id="subtitle" class="subtitle">Ambient weather, quiet roads, and lakeshore transmissions.</div>
    </div>

    <aside class="right-block">
      <div class="live-pill">
        <span class="dot"></span>
        <span id="status">Signal Active</span>
      </div>
      <div id="meta" class="meta">Newcastle, Ontario • North Shore Relay</div>
    </aside>
  </section>

  <section class="ticker">
    <div id="tickerLabel" class="ticker-label">Pulse Wire</div>
    <div class="ticker-window">
      <div id="tickerText" class="ticker-track">
        Newcastle Port Pulse • Your Signal on the Lakeshore • Field recordings, weather notes, quiet roads, and late-night broadcasts •
      </div>
    </div>
  </section>

  <script>
    const modes = {
      standard: {
        eyebrow: "Signals After Dark",
        title: "Newcastle Port Pulse",
        subtitle: "Ambient weather, quiet roads, and lakeshore transmissions.",
        status: "Signal Active",
        meta: "Newcastle, Ontario • North Shore Relay",
        tickerLabel: "Pulse Wire",
        tickerText: "Newcastle Port Pulse • Your Signal on the Lakeshore • Field recordings, weather notes, quiet roads, and late-night broadcasts •"
      },
      weather: {
        eyebrow: "Weather Watch",
        title: "Light Rain Along The Lakeshore",
        subtitle: "11°C • Wet roads • Lake wind possible near exposed areas.",
        status: "Weather Relay",
        meta: "Newcastle • Clarington • Lake Ontario Shore",
        tickerLabel: "Weather Wire",
        tickerText: "Weather Watch • Light rain near the lakeshore • Drive carefully on wet roads • Visibility may change near open corridors •"
      },
      alert: {
        eyebrow: "Weather Alert Active",
        title: "Storm Warning",
        subtitle: "Severe weather activity detected near the north shore corridor.",
        status: "Alert Mode",
        meta: "Monitor official sources • Conditions may change rapidly",
        tickerLabel: "Emergency Wire",
        tickerText: "Weather alert active • Monitor official weather sources • Avoid flooded roads • Stay with the signal •"
      },
      ai: {
        eyebrow: "LUMA AI Relay",
        title: "Automated Overnight Broadcast",
        subtitle: "Generated field notes, weather summaries, and calm signal continuity.",
        status: "AI Relay",
        meta: "SAGE Link Pending • Overnight Mode",
        tickerLabel: "AI Wire",
        tickerText: "Automated overnight relay • LUMA signal preparing • SAGE integration pending • Quiet broadcast continuity online •"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const selectedMode = params.get("mode");

    if (selectedMode && modes[selectedMode]) {
      document.body.className = selectedMode;
    }

    const activeMode = document.body.className || "standard";
    const data = modes[activeMode] || modes.standard;

    Object.entries(data).forEach(([key, value]) => {
      const el = document.getElementById(key);
      if (el) el.textContent = value;
    });
  </script>
</body>
</html>
